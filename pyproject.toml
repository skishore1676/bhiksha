[project]
name = "bhiksha"
version = "0.1.0"
description = "Config-driven live execution runtime for Mala strategy deployments."
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.169.0",
  "google-auth>=2.40.0",
  "google-auth-httplib2>=0.2.0",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "numpy>=2.2.4",
  "polars>=1.27.1",
  "pydantic>=2.11.1",
  "PyYAML>=6.0.2",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
